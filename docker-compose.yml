# Local MongoDB + Redis for development, CI, and scripts/verify-linux.sh.
# Not a production deployment: no auth, bound to localhost only.
#   docker compose up -d       # start
#   docker compose down -v     # stop and delete data
services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:${DOCMAN_MONGO_PORT:-27018}:27017"
    volumes:
      - docman-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${DOCMAN_REDIS_PASSWORD:-docman-dev-redis}"]
    ports:
      - "127.0.0.1:${DOCMAN_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DOCMAN_REDIS_PASSWORD:-docman-dev-redis}", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  docman-mongo:
