name: Deploy DocMan to Linode

on:
  workflow_dispatch:

concurrency:
  group: linode-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCMAN_UI: ${{ vars.DOCMAN_UI || 'vue' }}
      LINODE_APP_DIR: ${{ vars.LINODE_APP_DIR || '/var/www/docman' }}
      LINODE_DOC_ROOT: ${{ vars.LINODE_DOC_ROOT || '/var/www/docman/html' }}
      LINODE_SERVICE_NAME: ${{ vars.LINODE_SERVICE_NAME || 'docman-backend.service' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            frontend-vue/package-lock.json

      - name: Build selected UI
        run: npm run build

      - name: Select frontend dist
        id: frontend
        shell: bash
        run: |
          if [[ "$DOCMAN_UI" == "react" || "$DOCMAN_UI" == "legacy" ]]; then
            echo "dist=frontend/dist" >> "$GITHUB_OUTPUT"
          else
            echo "dist=frontend-vue/dist" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Linode
        env:
          PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          FRONTEND_DIST: ${{ steps.frontend.outputs.dist }}
        shell: bash
        run: |
          set -euo pipefail

          echo "$PRIVATE_KEY" > private_key
          chmod 600 private_key

          SSH_OPTS="-i private_key -o StrictHostKeyChecking=no"

          rsync -az --delete -e "ssh $SSH_OPTS" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'backend/.env.prod' \
            --exclude 'backend/uploads' \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend-vue/node_modules' \
            --exclude 'docs-site/node_modules' \
            --exclude 'docs-site/build' \
            --exclude 'frontend/dist' \
            --exclude 'frontend-vue/dist' \
            ./ "${USER}@${HOST}:${LINODE_APP_DIR}/"

          rsync -az --delete -e "ssh $SSH_OPTS" \
            "${FRONTEND_DIST}/" \
            "${USER}@${HOST}:/tmp/docman-frontend-dist/"

          ssh $SSH_OPTS "${USER}@${HOST}" \
            "set -euo pipefail
             cd '${LINODE_APP_DIR}/backend'
             npm ci --omit=dev
             sudo install -d -o www-data -g www-data -m 775 '${LINODE_DOC_ROOT}'
             sudo rsync -a --delete /tmp/docman-frontend-dist/ '${LINODE_DOC_ROOT}/'
             sudo chown -R www-data:www-data '${LINODE_DOC_ROOT}'
             sudo systemctl restart '${LINODE_SERVICE_NAME}'"
