name: Dependency security audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - 'scripts/security-audit*'
      - '.github/workflows/dependency-audit.yml'
  push:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - 'scripts/security-audit*'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '23 12 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit error handling
        run: node --test scripts/security-audit.test.js
      - name: Audit all lockfiles (including build and test dependencies)
        run: npm run security:audit
